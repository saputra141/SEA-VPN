
name: Build SEA VPN APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      # 1. Ambil repository dan submodule
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      # 2. Pastikan submodule upstream Hysteria tersedia
      - name: Initialize Hysteria upstream submodule
        run: |
          git submodule sync --recursive
          git submodule update --init --recursive
          cd hysteria
          git submodule update --init --recursive
          cd ..
          git submodule status --recursive

      # 3. Java
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      # 4. Go
      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          cache: false

      # 5. Android SDK
      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      # 6. Install SDK dan NDK
      - name: Install Android SDK and NDK
        run: |
          sdkmanager "platform-tools" \
            "platforms;android-36" \
            "build-tools;36.0.0" \
            "ndk;30.0.14904198"

      # 7. Install gomobile dan gobind
      - name: Install gomobile and gobind
        run: |
          go install golang.org/x/mobile/cmd/gomobile@latest
          go install golang.org/x/mobile/cmd/gobind@latest
          echo "$HOME/go/bin" >> "$GITHUB_PATH"
          gomobile init

      # 8. Gradle
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.4.1'

      # 9. Perbaiki plugin Bedlam/Hysteria
      - name: Fix Hysteria plugin resolution
        run: |
          sed -i 's/alias(libs.plugins.android.library)/id("com.android.library")/' hysteria/hysteria/build.gradle.kts
          sed -i 's/alias(libs.plugins.kotlin.serialization)/id("org.jetbrains.kotlin.plugin.serialization")/' hysteria/hysteria/build.gradle.kts

      # 10. Build APK
      - name: Build APK
        run: |
          gradle assembleDebug --stacktrace

      # 11. Upload APK
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: SEA-VPN-APK
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
