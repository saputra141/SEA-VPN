name: Build SEA VPN APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      # 2. Initialize submodules
      - name: Initialize Hysteria submodules
        run: |
          git submodule sync --recursive
          git submodule update --init --recursive
          git submodule status --recursive
          cp hysteria/.github/toolchain.env .github/toolchain.env

      # 3. Java
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      # 4. Go
      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          cache: false

      # 5. Android SDK
      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      # 6. Install SDK and NDK
      - name: Install Android SDK and NDK
        run: |
          sdkmanager "platform-tools" \
            "platforms;android-36" \
            "build-tools;36.0.0" \
            "ndk;30.0.14904198"

      # 7. Install gomobile
      - name: Install gomobile and gobind
        run: |
          go install golang.org/x/mobile/cmd/gomobile@latest
          go install golang.org/x/mobile/cmd/gobind@latest
          echo "$HOME/go/bin" >> "$GITHUB_PATH"
          gomobile init

      # 8. Setup compatible Gradle
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      # 9. Fix Android Gradle Plugin and Kotlin versions
      - name: Fix Gradle plugin versions
        run: |
          sed -i 's/9.2.1/8.9.1/g' build.gradle.kts
          sed -i 's/2.4.20/2.1.20/g' build.gradle.kts
          sed -i 's/9.2.1/8.9.1/g' settings.gradle.kts
          sed -i 's/2.4.20/2.1.20/g' settings.gradle.kts

      # 10. Fix Hysteria Gradle plugins and BuildConfig configuration
      - name: Fix Hysteria Gradle configuration
        run: |
          sed -i 's/alias(libs.plugins.android.library)/id("com.android.library")/' hysteria/hysteria/build.gradle.kts
          sed -i 's/alias(libs.plugins.kotlin.serialization)/id("org.jetbrains.kotlin.plugin.serialization")/' hysteria/hysteria/build.gradle.kts

          python3 - <<'PY'
          from pathlib import Path
          import re

          path = Path("hysteria/hysteria/build.gradle.kts")
          text = path.read_text()

          # Hapus pendaftaran BuildConfigField berbasis variant yang gagal
          # mengonfigurasi task generateDebugBuildConfig.
          text, count = re.subn(
              r"\nandroidComponents \{\n    onVariants \{ variant ->.*?\n    \}\n\}\n",
              "\n",
              text,
              count=1,
              flags=re.S,
          )
          if count != 1:
              raise SystemExit(
                  "Blok androidComponents untuk CORE_VERSION tidak ditemukan"
              )

          # Daftarkan CORE_VERSION melalui defaultConfig.
          marker = 'val golibDir = layout.projectDirectory.dir("golib")'
          build_config = r'''android.defaultConfig.buildConfigField(
              "String",
              "CORE_VERSION",
              "\"${hysteriaCoreVersion.get()}\"",
          )

          '''

          if marker not in text:
              raise SystemExit(
                  "Titik penyisipan CORE_VERSION tidak ditemukan"
              )

          path.write_text(text.replace(marker, build_config + marker, 1))
          PY

      # 11. Set Android compile SDK
      - name: Set compileSdk 36
        run: |
          sed -i -E 's/compileSdk[[:space:]]*=[[:space:]]*[0-9]+/compileSdk = 36/' app/build.gradle.kts
          sed -i -E 's/compileSdk[[:space:]]*=[[:space:]]*[0-9]+/compileSdk = 36/' hysteria/hysteria/build.gradle.kts

      # 12. Fix AndroidX dependency versions
      - name: Fix AndroidX dependency versions
        run: |
          cat > "$RUNNER_TEMP/androidx-fix.gradle" <<'EOF'
          allprojects {
              configurations.configureEach {
                  resolutionStrategy.force(
                      'androidx.core:core:1.15.0',
                      'androidx.core:core-ktx:1.15.0'
                  )
              }
          }
          EOF

      # 13. Build APK
      - name: Build APK
        run: |
          gradle assembleDebug \
            --stacktrace \
            --init-script "$RUNNER_TEMP/androidx-fix.gradle" \
            -x :hysteria:syncHysteriaSubmodule

      # 14. Upload APK
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: SEA-VPN-APK
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
